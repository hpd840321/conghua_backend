server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    max-connections: 10000
    connection-timeout: 5000
    uri-encoding: UTF-8

spring:
  application:
    name: scenic-management
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  datasource:
    url: jdbc:dm://localhost:5236/SCENIC_AI
    driver-class-name: com.dameng.jdbc.driver.DmDriver
    username: SYSDBA
    password: SYSDBA
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      pool-name: HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1 FROM DUAL
  sql:
    init:
      mode: never
      platform: dm
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
  mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: com.scenic.ai.domain.model
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
      default-statement-timeout: 30
  pagehelper:
    helper-dialect: dm
    reasonable: true
    support-methods-arguments: true
    params: count=countSql

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    filter: true
  show-actuator: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

sync:
  scheduler:
    statistics: 0 0/30 * * * ?  # 每30分钟同步一次统计数据
    details: 0 15/30 * * * ?    # 每30分钟同步一次详细数据
    panorama: 0 0 0/1 * * ?     # 每小时同步一次全景图
    alert:
      check:
        cron: 0 */5 * * * ?     # 每5分钟检查一次告警
  retry:
    max-attempts: 3
    delay: 1000
    max-delay: 10000
    multiplier: 2.0

storage:
  base-path: /data/scenic-ai/images
  max-size: 10485760
  allowed-types:
    - image/jpeg
    - image/png
  image:
    width: 1024
    height: 768
    quality: 0.8
    format: jpg

third-party:
  base-url: http://172.26.46.25:30081
  api-path: /api
  connect-timeout: 5000
  read-timeout: 10000
  max-retries: 3
  retry-delay: 1000
  image-storage-path: /data/images

logging:
  level:
    root: INFO
    com.scenic.ai: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  file:
    path: logs/
    name: application.log
  charset:
    console: UTF-8
    file: UTF-8

ai:
  analysis:
    crowd-count:
      url: ${AI_CROWD_COUNT_URL}
      confidence-threshold: ${AI_CROWD_COUNT_THRESHOLD:0.8}
    gathering:
      url: ${AI_GATHERING_URL}
      confidence-threshold: ${AI_GATHERING_THRESHOLD:0.7}
    density:
      url: ${AI_DENSITY_URL}
      threshold: ${AI_DENSITY_THRESHOLD:0.6}

scheduler:
  alert:
    check:
      cron: 0 */5 * * * ?  # 每5分钟检查一次告警

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.scenic.ai.entity